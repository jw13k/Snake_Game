<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake - Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script>
        // Global Error Handler for user debugging
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            const overlay = document.getElementById('debug-overlay') || document.createElement('div');
            overlay.id = 'debug-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100%';
            overlay.style.background = 'rgba(255, 0, 0, 0.8)';
            overlay.style.color = 'white';
            overlay.style.padding = '10px';
            overlay.style.zIndex = '9999';
            overlay.style.fontFamily = 'monospace';
            overlay.innerHTML += `<div>Error: ${msg} <br> File: ${url} <br> Line: ${lineNo}</div><hr>`;
            if (!document.getElementById('debug-overlay')) document.body.prepend(overlay);
            return false;
        };
    </script>

    <div id="main-menu" class="main-menu-container">
        <h1 class="main-title">NEON SNAKE</h1>
        <div class="menu-buttons">
            <button id="main-start-btn" class="glow-btn large-btn">START GAME</button>
            <button id="main-settings-btn" class="glow-btn">SETTINGS</button>
            <button id="main-exit-btn" class="glow-btn">EXIT</button>
        </div>
    </div>

    <!-- Stage Select Screen -->
    <div id="stage-select-screen" class="menu-container hidden">
        <h2 class="menu-title">SELECT STAGE</h2>
        <div class="stage-map-container">
            <div class="stage-node unlocked" data-stage="1">
                <div class="stage-icon">1</div>
                <div class="stage-label">SOLDIER</div>
            </div>
            <div class="stage-line"></div>
            <div class="stage-node locked" data-stage="2">
                <div class="stage-icon">2</div>
                <div class="stage-label">BOSS</div>
            </div>
        </div>
        <button id="stage-back-btn" class="glow-btn small-btn" style="margin-top: 50px;">BACK</button>
    </div>

    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 class="modal-title">SETTINGS</h2>

            <div class="setting-item">
                <label>VOLUME</label>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
            </div>

            <div class="setting-item">
                <label>BRIGHTNESS</label>
                <input type="range" id="brightness-slider" min="50" max="150" value="100">
            </div>

            <div class="setting-item">
                <label>LANGUAGE</label>
                <select id="language-select" class="neon-select">
                    <option value="en">ENGLISH</option>
                    <option value="ko">KOREAN</option>
                </select>
            </div>

            <button id="close-settings-btn" class="glow-btn small-btn">CLOSE</button>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="menu.js"></script>
</body>

</html>
